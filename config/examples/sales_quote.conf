# .sdd/config.sh — sales_quote
#
# Bash puro: o runner faz `source`. Só atribuições, sem lógica.
# Documentação de cada chave: config/schema.md

PROJECT_NAME="sales_quote"

# ATENÇÃO: NÃO é `main`. O fluxo do repo é develop → staging → main, e `origin/HEAD` aponta
# para `develop`. O mesmo valor está em `.jira-project` (BASE_BRANCH), com a nota de que a
# skill `ticket` já errou isto uma vez. PR aberto contra a branch errada é retrabalho garantido.
DEFAULT_BRANCH="develop"

# --- sensores ---------------------------------------------------------------
TEST_CMD="npm test"                 # roda os workspaces com --if-present; lint e build entram AQUI
E2E_CMD="npm run e2e"               # playwright test (playwright.config.ts na raiz)
E2E_DIR="e2e"                       # 21 specs, convenção sq<NN>-<slug>.spec.ts

# --- app rodando (fase QA) --------------------------------------------------
APP_URL="http://localhost:5173"     # o runner não sobe o ambiente — `docker compose up -d` é seu

# --- artefatos --------------------------------------------------------------
HANDOFF_DIR="docs/handoffs"
QA_DOCS_PATH="docs/qa"
TODO_FILE="TODO.md"

# --- modelos por fase -------------------------------------------------------
MODEL_EXEC="opus"
MODEL_QA="opus"
MODEL_REVIEW="opus"
MODEL_DOCS="opus"
MODEL_PUBLISH="sonnet"              # montar PR a partir de handoffs prontos é mecânico
MODEL_TICKET="sonnet"               # acli com campos já decididos é mecânico

# --- limites e política -----------------------------------------------------
QA_MAX_ITER=3
REVIEW_MAX_ITER=3
EXEC_MAX_RETRY=1
BUDGET_PER_PHASE_USD=15
PUBLISH_ON_REVIEW_BLOCKED="off"     # "draft" abre PR draft quando o review estoura
PERMISSION_MODE="acceptEdits"
# acceptEdits libera EDICAO DE ARQUIVO, nao `Bash`. Sem isto a sessao nao roda a suite nem
# commita, e a fase EXEC fica insatisfazivel por construcao. Veja config/schema.md.
ALLOWED_TOOLS="Bash"

# --- jira -------------------------------------------------------------------
JIRA_ENABLED=true                   # projeto SQ, board 51 — ver .jira-project
