# .sdd/config.sh — <PROJECT_NAME>
#
# Gerado por `sdd install`. Bash puro: o runner faz `source`. Só atribuições.
# Documentação de cada chave: <SDD_HOME>/config/schema.md
#
# Preencha o que está como TODO antes de rodar `sdd preflight`.

PROJECT_NAME="<PROJECT_NAME>"

# Branch base das PRs. Detectada de origin/HEAD; confirme — nem todo repo usa `main`.
DEFAULT_BRANCH="<DEFAULT_BRANCH>"

# --- sensores ---------------------------------------------------------------
TEST_CMD="<TEST_CMD>"               # obrigatório: gate de EXEC e de REVIEW
E2E_CMD=""                          # vazio ⇒ gate de QA ignora e2e
E2E_DIR="e2e"
LINT_CMD=""
BUILD_CMD=""

# --- app rodando (fase QA) --------------------------------------------------
APP_URL=""
DEV_UP_CMD=""
DEV_READY_CMD=""
DEV_READY_TIMEOUT=90

# --- artefatos --------------------------------------------------------------
HANDOFF_DIR="docs/handoffs"
QA_DOCS_PATH="docs/qa"
TODO_FILE="TODO.md"

# --- modelos por fase -------------------------------------------------------
MODEL_EXEC="opus"
MODEL_QA="opus"
MODEL_REVIEW="opus"
MODEL_DOCS="opus"
MODEL_PUBLISH="sonnet"              # mecânico — Opus seria desperdício
MODEL_TICKET="sonnet"               # mecânico — Opus seria desperdício

# --- limites e política -----------------------------------------------------
QA_MAX_ITER=3
REVIEW_MAX_ITER=3
EXEC_MAX_RETRY=1
BUDGET_PER_PHASE_USD=15
PUBLISH_ON_REVIEW_BLOCKED="off"     # "draft" abre PR draft quando o review estoura
PERMISSION_MODE="acceptEdits"

# --- jira -------------------------------------------------------------------
JIRA_ENABLED=false                  # true exige .jira-project no repo (skill `ticket`)
