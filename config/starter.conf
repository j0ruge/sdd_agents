# .sdd/config.sh — <PROJECT_NAME>
#
# Generated by `sdd install`. Pure bash: the runner sources it. Assignments only.
# Documentation for every key: <SDD_HOME>/config/schema.md
#
# Fill in whatever is marked TODO before running `sdd preflight`.

PROJECT_NAME="<PROJECT_NAME>"

# Base branch for PRs. Detected from origin/HEAD; confirm it — not every repo uses `main`.
DEFAULT_BRANCH="<DEFAULT_BRANCH>"

# Language of the ARTIFACTS (handoff, checkpoint, commit, PR) — e.g. "pt-BR", "en", "es".
# Empty means the runner says nothing about language and each session follows what the existing
# artifacts already use. The kit itself is English; this does not change that.
OUTPUT_LANG=""

# --- sensors ----------------------------------------------------------------
TEST_CMD="<TEST_CMD>"               # required: the EXEC gate and part of the REVIEW gate
                                    # lint and build go INSIDE it — the runner reads no other sensor
E2E_CMD=""                          # empty ⇒ the QA gate ignores e2e
E2E_DIR="e2e"

# --- running app (QA phase) -------------------------------------------------
APP_URL=""                          # the runner assumes the app is already up; it does not start it
                                    # — it only ASKS: preflight, and gate_QA once the e2e is red

# --- artifacts --------------------------------------------------------------
HANDOFF_DIR="docs/handoffs"
QA_DOCS_PATH="docs/qa"
TODO_FILE="TODO.md"

# --- models per phase -------------------------------------------------------
MODEL_EXEC="opus"
MODEL_QA="opus"
MODEL_REVIEW="opus"
MODEL_DOCS="opus"
MODEL_PUBLISH="sonnet"              # mechanical — Opus would be waste
MODEL_TICKET="sonnet"               # mechanical — Opus would be waste

# --- limits and policy ------------------------------------------------------
QA_MAX_ITER=3
REVIEW_MAX_ITER=3
# Every criterion must read A, except the ones graded on prose, which pass at the floor.
REVIEW_PROSE_CRITERIA="Documentation,Overall"
REVIEW_PROSE_MIN_GRADE="B"
EXEC_MAX_RETRY=1
BUDGET_PER_PHASE_USD=15             # DOCS, PR, TICKET, KAIZEN — the phases with no key of their own
BUDGET_EXEC_USD=25                  # one increment in TDD
BUDGET_QA_USD=25                    # per session; a QA round is up to three of them
BUDGET_REVIEW_USD=40                # the expensive phase — raising the global does NOT raise this
BUDGET_MISSION_USD=150              # the whole mission, read off the journal BEFORE a phase opens; 0 = no ceiling; --budget-override goes on once
PUBLISH_ON_REVIEW_BLOCKED="off"     # "draft" opens a draft PR when the review runs out of rounds
# Runs on every rc 3 (blocked, budget-exhausted, no-progress, app-down) with SDD_REASON, SDD_PHASE,
# SDD_MISSION, SDD_PROJECT and SDD_GATE_WHY in its env. Empty = the line stops in silence.
# e.g. ON_ESCALATION_CMD='notify-send "sdd $SDD_MISSION" "$SDD_PHASE stopped: $SDD_REASON"'
ON_ESCALATION_CMD=""
PERMISSION_MODE="acceptEdits"
# acceptEdits unlocks FILE EDITS, not `Bash`. Without this the session cannot run the suite nor
# commit, and the EXEC phase becomes unsatisfiable by construction. See config/schema.md.
ALLOWED_TOOLS="Bash"

# --- jira -------------------------------------------------------------------
JIRA_ENABLED=false                  # true requires .jira-project in the repo (`ticket` skill)
